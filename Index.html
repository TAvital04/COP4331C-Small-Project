<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactSphere - Personal Contact Manager</title>
    <link href="css/styles.css" rel="stylesheet">
    <script src="js/code.js" defer></script>
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="navbar">
        <a href="#" class="brand" aria-label="ContactSphere Home">
            <div class="brand-icon" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
            </div>
            <div class="brand-text">
                <h1>ContactSphere</h1>
                <span>COP 4331 Small Project</span>
            </div>
        </a>

        <!-- User profile widget (Visible when logged in) -->
        <div id="navUserWidget" class="nav-user hidden">
            <div class="user-badge">
                <div id="userAvatar" class="user-avatar" aria-hidden="true">U</div>
                <span id="navUserName" class="user-name">User</span>
            </div>
            <button type="button" class="btn btn-secondary btn-sm" onclick="doLogout();" aria-label="Sign Out">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Sign Out
            </button>
        </div>
    </header>

    <main class="main-wrapper">
        <div class="container">

            <!-- Authentication Card (Login & Register) -->
            <div id="authSection" class="auth-container">
                <div class="glass-card">
                    <div class="auth-header">
                        <h2 id="authTitle">Welcome Back</h2>
                        <p id="authSubtitle">Manage your personal contact directory effortlessly</p>
                    </div>

                    <!-- Auth Toggle Tabs -->
                    <div class="tab-group" role="tablist">
                        <button type="button" id="tabLogin" class="tab-btn active" role="tab" aria-selected="true" onclick="switchAuthTab('login');">Sign In</button>
                        <button type="button" id="tabRegister" class="tab-btn" role="tab" aria-selected="false" onclick="switchAuthTab('register');">Register</button>
                    </div>

                    <!-- Login Form -->
                    <form id="loginForm" onsubmit="event.preventDefault(); doLogin();">
                        <div id="loginError" class="text-danger hidden" role="alert"></div>
                        <div class="form-group">
                            <label for="loginName">Username</label>
                            <div class="input-wrapper">
                                <input type="text" id="loginName" name="login" class="form-control" placeholder="Enter username" required autocomplete="username" />
                                <span class="input-icon" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                        <circle cx="12" cy="7" r="4"></circle>
                                    </svg>
                                </span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter password" required autocomplete="current-password" />
                                <span class="input-icon" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                    </svg>
                                </span>
                            </div>
                        </div>

                        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Sign In</button>
                    </form>

                    <!-- Registration Form -->
                    <form id="registerForm" class="hidden" onsubmit="event.preventDefault(); doRegister();">
                        <div id="registerError" class="text-danger hidden" role="alert"></div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="regFirstName">First Name</label>
                                <div class="input-wrapper">
                                    <input type="text" id="regFirstName" name="firstName" class="form-control" placeholder="First Name" required autocomplete="given-name" />
                                    <span class="input-icon" aria-hidden="true">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                            <circle cx="12" cy="7" r="4"></circle>
                                        </svg>
                                    </span>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="regLastName">Last Name</label>
                                <div class="input-wrapper">
                                    <input type="text" id="regLastName" name="lastName" class="form-control" placeholder="Last Name" required autocomplete="family-name" />
                                    <span class="input-icon" aria-hidden="true">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                            <circle cx="12" cy="7" r="4"></circle>
                                        </svg>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="regLogin">Username</label>
                            <div class="input-wrapper">
                                <input type="text" id="regLogin" name="login" class="form-control" placeholder="Choose a username" required autocomplete="username" />
                                <span class="input-icon" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                                        <line x1="9" y1="9" x2="9.01" y2="9"></line>
                                        <line x1="15" y1="9" x2="15.01" y2="9"></line>
                                    </svg>
                                </span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="regPassword">Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="regPassword" name="password" class="form-control" placeholder="Create a password" required autocomplete="new-password" />
                                <span class="input-icon" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                    </svg>
                                </span>
                            </div>
                        </div>

                        <button type="submit" id="registerBtn" class="btn btn-primary btn-block">Create Account</button>
                    </form>
                </div>
            </div>

            <!-- Contacts Dashboard Section (Hidden by default) -->
            <div id="dashboardSection" class="hidden">
                <div class="dashboard-header">
                    <div class="dashboard-title">
                        <h2>Contacts Directory</h2>
                        <p id="dashboardGreeting">Manage and organize your personal contacts</p>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="openContactModal('add');">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Add New Contact
                    </button>
                </div>

                <!-- Search & Filters Toolbar -->
                <div class="search-toolbar">
                    <div class="search-box">
                        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search by name, phone, or email..." oninput="handleSearchInput();" />
                        <button type="button" id="searchClearBtn" class="clear-btn" aria-label="Clear Search" onclick="clearSearch();">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Contact Grid Container -->
                <div id="contactsGrid" class="contacts-grid" aria-live="polite">
                    <!-- Rendered dynamically via JavaScript -->
                </div>
            </div>

        </div>
    </main>

    <!-- Add / Edit Contact Modal -->
    <div id="contactModal" class="modal-overlay" aria-modal="true" role="dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add Contact</h3>
                <button type="button" class="modal-close" aria-label="Close modal" onclick="closeContactModal();">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <form id="contactForm" onsubmit="event.preventDefault(); saveContact();">
                <input type="hidden" id="contactId" value="0" />
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="contactFirstName">First Name *</label>
                        <input type="text" id="contactFirstName" class="form-control no-icon" placeholder="Jane" required />
                    </div>
                    <div class="form-group">
                        <label for="contactLastName">Last Name *</label>
                        <input type="text" id="contactLastName" class="form-control no-icon" placeholder="Doe" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="contactPhone">Phone Number</label>
                    <div class="input-wrapper">
                        <input type="tel" id="contactPhone" class="form-control" placeholder="(555) 000-0000" />
                        <span class="input-icon" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="contactEmail">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="contactEmail" class="form-control" placeholder="jane.doe@example.com" />
                        <span class="input-icon" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </span>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeContactModal();">Cancel</button>
                    <button type="submit" id="saveContactBtn" class="btn btn-primary">Save Contact</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal-overlay" aria-modal="true" role="alertdialog">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Confirm Deletion</h3>
                <button type="button" class="modal-close" aria-label="Close deletion modal" onclick="closeDeleteModal();">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Are you sure you want to delete <strong id="deleteContactName" style="color: var(--text-main);">this contact</strong>? This action cannot be undone.</p>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeDeleteModal();">Cancel</button>
                <button type="button" class="btn btn-danger" onclick="confirmDeleteContact();">Delete Contact</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
</body>
</html>
